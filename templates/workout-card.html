<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    position: relative;
    background: #1C232B;
    color: #F4F1EB;
    font-family: "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
  }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  body.route-only .photo { display: none; }
  .top-scrim {
    position: absolute; inset: 0 0 auto; height: 190px;
    background: linear-gradient(180deg, rgba(10,14,19,.64), rgba(10,14,19,0));
  }
  .bottom-scrim {
    position: absolute; inset: auto 0 0; height: 470px;
    background: linear-gradient(180deg, rgba(10,14,19,0), rgba(10,14,19,.97) 74%);
  }
  .route { position: absolute; inset: 0; width: 1080px; height: 1080px; }
  .meta { position: absolute; top: 46px; left: 54px; }
  .sport { font-size: 21px; font-weight: 700; letter-spacing: 5px; }
  .date { margin-top: 12px; color: rgba(228,230,233,.86); font-size: 18px; letter-spacing: .6px; }
  .privacy {
    position: absolute; top: 50px; right: 54px; max-width: 360px;
    color: rgba(228,230,233,.82); font-size: 18px; text-align: right;
  }
  .distance { position: absolute; left: 54px; top: 726px; display: flex; align-items: baseline; }
  .distance .value { font-size: 104px; font-weight: 740; letter-spacing: -5px; line-height: 1; }
  .distance .unit { margin-left: 14px; color: #C9CDD4; font-size: 26px; font-weight: 600; }
  .distance-label { position: absolute; left: 56px; top: 853px; color: #C9CDD4; font-size: 19px; }
  .heart { position: absolute; left: 720px; top: 757px; }
  .heart .value { font-size: 54px; font-weight: 700; letter-spacing: -2px; }
  .heart .unit { margin-left: 10px; color: #C9CDD4; font-size: 19px; }
  .heart .label { margin-top: 4px; color: #C9CDD4; font-size: 19px; }
  .support {
    position: absolute; left: 54px; right: 54px; top: 905px;
    display: grid; grid-template-columns: 290px 1fr auto; align-items: baseline;
    color: rgba(238,239,241,.92); font-size: 22px;
  }
  .support small { color: #C9CDD4; font-size: 16px; margin-left: 7px; }
  .trace { color: rgba(201,205,212,.72); font-size: 16px; letter-spacing: 2px; }
  .insight {
    position: absolute; left: 54px; right: 54px; top: 967px;
    min-height: 74px; border-left: 7px solid #F26B4B; padding: 0 0 0 27px;
    color: #F4F1EB; font-size: 27px; line-height: 1.5; font-weight: 590;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
</style>
</head>
<body class="{{PHOTO_CLASS}}">
  <img class="photo" src="{{PHOTO_DATA_URL}}" alt="">
  <div class="top-scrim"></div>
  <div class="bottom-scrim"></div>
  {{ROUTE_SVG}}
  <div class="meta">
    <div class="sport">{{SPORT_LABEL}}</div>
    <div class="date">{{DATE_STR}}</div>
  </div>
  <div class="privacy">{{PRIVACY_TAG}}</div>
  <div class="distance"><span class="value">{{DIST}}</span><span class="unit">km</span></div>
  <div class="distance-label">距离</div>
  <div class="heart">
    <div><span class="value">{{AVGHR}}</span><span class="unit">bpm</span></div>
    <div class="label">平均心率</div>
  </div>
  <div class="support">
    <div>{{DUR}} <small>时长</small></div>
    <div>{{PACE}} <small>平均配速</small></div>
    <div class="trace">GPS TRACE</div>
  </div>
  <div class="insight">{{ONE_LINER}}</div>
</body>
</html>
